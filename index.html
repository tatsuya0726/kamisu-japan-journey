<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icons/icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="mobile-web-app-capable" content="yes"><meta name="theme-color" content="#183f49"><meta name="description" content="猫チームで神栖を守るオリジナルの横型タワーディフェンス"><title>神栖を守れ！！</title><link rel="preload" as="image" href="./defense/runtime/kamisu-map.jpg" fetchpriority="high"><link rel="preload" as="image" href="./defense/runtime/cream.png"><link rel="preload" as="image" href="./defense/runtime/silver.png"><style>#boot-title{position:fixed;inset:0;z-index:99999;background:#112f3a;color:#fff2d5;display:grid;place-content:center;padding:24px;font-family:Meiryo,sans-serif;text-align:center}#boot-title h1{font-size:clamp(36px,7vw,80px);color:#e9bc70}html:not(.app-ready) #app{visibility:hidden}#boot-title button{min-height:48px;padding:12px;background:#e9bc70;color:#112f3a;border:0;border-radius:10px} #boot-title{overflow:auto}#boot-title h1{margin:12px 0}#boot-title .landscape-note{font-size:12px;line-height:1.6;margin:12px 0 0}#boot-status{font-size:12px;max-width:440px}#tap-start{font-weight:bold;font-size:18px;min-width:240px;min-height:52px}@media(max-height:430px){#boot-title{padding:12px}#boot-title h1{font-size:36px;margin:6px 0}#boot-title p{margin:6px 0}#boot-title .landscape-note{font-size:11px}}</style></head><body><section id="boot-title" aria-label="タイトル"><p>KAMISU CAT DEFENSE</p><h1>神栖を守れ！！</h1><button id="tap-start" disabled>タップしてスタート</button><p class="landscape-note">本ゲームは横画面専用です。<br>ホーム画面に追加して、横画面でお楽しみください。</p><p id="boot-status" role="status">ゲームを準備しています…</p><button id="boot-retry" hidden onclick="location.reload()">もう一度ひらく</button><noscript>遊ぶにはJavaScriptを有効にしてください。</noscript></section><script>setTimeout(function(){var b=document.getElementById('boot-title');if(b&&!b.dataset.ready){document.getElementById('boot-status').textContent='起動に時間がかかっています。通信を確認して、もう一度ひらいてください。記録は消えません。';document.getElementById('boot-retry').hidden=false}},12000)</script><div id="app"><header><a class="brand" id="title" href="#">神栖を守れ！！<small>KAMISU CAT DEFENSE</small></a><span class="build-note">候補版 / 仮素材</span><button id="catalog">ねこ図鑑</button><button id="help">あそび方</button></header><main class="battle-layout"><div class="topline"><button id="pause" aria-label="一時停止">一時停止</button><div><span class="eyebrow">ねこの町まもり隊</span><h1 id="stage-name">神栖防衛作戦</h1></div><span id="timer">0秒</span></div><div class="controls"><button id="speed">速度 ×1</button><button id="settings">設定</button></div><section class="battlefield"><div id="hud"></div><div id="game" aria-label="猫と架空の侵略者が戦う横型の戦場"></div><div id="battle-chat" hidden aria-live="polite"></div><nav class="camera-controls" aria-label="戦場カメラ"><button data-pan="-1" aria-label="戦場を左へ">◀</button><button data-base="home">町へ</button><meter id="camera-position" min="0" max="100" value="0" aria-label="戦場の表示位置"></meter><button data-base="enemy">敵へ</button><button data-pan="1" aria-label="戦場を右へ">▶</button></nav></section><aside id="art-notice"><span id="art-status" role="status"></span><button id="retry-art" hidden>画像を再試行（1回）</button></aside><div id="message" role="status">準備中…</div><section id="cards" aria-label="猫の出撃"></section><button id="assist" class="battle-orb orb-assist" aria-pressed="false">おまかせ OFF</button><button id="map" class="battle-orb orb-map">作戦マップ</button><footer><span>1〜4キーでも出撃 / Pで停止</span><span id="save-note">クリア記録を自動保存</span></footer></main><dialog id="modal"></dialog></div><script type="module" src="/src/td.ts"></script></body></html>
