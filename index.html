<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icons/icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="mobile-web-app-capable" content="yes"><meta name="theme-color" content="#183f49"><meta name="description" content="猫チームで神栖を守るオリジナルの横型タワーディフェンス"><title>神栖を守れ！！</title><link rel="preload" as="image" href="./defense/runtime/kamisu-map.jpg" fetchpriority="high"><link rel="preload" as="image" href="./defense/runtime/cream.png"><link rel="preload" as="image" href="./defense/runtime/silver.png"><style>:root{--ui:"Hiragino Maru Gothic ProN","Zen Maru Gothic","BIZ UDPGothic","Yu Gothic","Hiragino Kaku Gothic ProN","Noto Sans JP",Meiryo,sans-serif}
#boot-title{position:fixed;inset:0;z-index:99999;display:grid;place-content:center;justify-items:center;padding:24px;overflow:auto;color:#fff1d0;font-family:var(--ui);text-align:center;background:linear-gradient(#1d6f7a 0 0) bottom/100% 38% no-repeat,repeating-linear-gradient(0deg,#1d6f7a 0 7px,#185e69 7px 14px) bottom/100% 38% no-repeat,radial-gradient(circle at 76% 62%,#ffd27a 0 17vmin,#ffb43b 17vmin 18vmin,transparent 18.2vmin),linear-gradient(#0c2230 0 24%,#123a52 24% 42%,#1d5b78 42% 55%,#ff8a5c 55% 59%,#ffb43b 59% 62%,#1d6f7a 62%)}
html:not(.app-ready) #app{visibility:hidden}
#boot-title>p:first-child{margin:0;padding:3px 12px;background:#0c2230;border-radius:4px;font-size:12px;letter-spacing:.12em;font-weight:700}
.logo span{position:relative;isolation:isolate;display:block;color:#ffb43b;-webkit-text-stroke:.05em #ffb43b}
.logo span::before,.logo span::after{content:attr(data-t);position:absolute;left:0;right:0;top:0;z-index:-1;white-space:nowrap}
.logo span::before{color:#fff1d0;-webkit-text-stroke:.46em #fff1d0;text-shadow:0 .12em 0 #06141d;z-index:-2}
.logo span::after{color:#0c2230;-webkit-text-stroke:.3em #0c2230}
.logo .a{font-size:.5em;color:#fff1d0;-webkit-text-stroke:.03em #fff1d0;letter-spacing:.3em;margin-bottom:.16em}
.logo .a::before{-webkit-text-stroke:.8em #fff1d0;color:#fff1d0}.logo .a::after{-webkit-text-stroke:.55em #0c2230}
.logo{margin:22px 0 18px;font-weight:900;line-height:1;transform:rotate(-3deg)}
#boot-title h1{font-size:clamp(44px,9vw,96px)}
#boot-title button{min-height:52px;padding:12px 28px;background:linear-gradient(#ffb43b 0 62%,#ff9d2e 62%);color:#0c2230;border:3px solid #0c2230;border-radius:10px;font:800 20px var(--ui);letter-spacing:.06em;box-shadow:0 5px 0 #c97a0a,0 8px 0 #06141d;min-width:260px}
#boot-title button:disabled{filter:grayscale(.6) brightness(.8)}
#boot-title button:not(:disabled):active{transform:translateY(4px);box-shadow:0 1px 0 #c97a0a,0 4px 0 #06141d}
#boot-title .landscape-note{font-size:12px;line-height:1.6;margin:16px 0 0;padding:4px 10px;background:#0c2230cc;border-radius:6px}
#boot-status{font-size:12px;max-width:440px;margin:8px 0 0;padding:2px 10px;background:#0c2230cc;border-radius:6px}
@media(max-height:430px){#boot-title{padding:8px}#boot-title h1{font-size:54px;margin:22px 0 18px}#boot-title button{min-height:44px;padding:8px 24px;font-size:17px}#boot-title .landscape-note{font-size:10px;margin-top:8px}#boot-title p{margin:3px 0}}
@media(prefers-reduced-motion:no-preference){.logo{animation:stamp .55s cubic-bezier(.2,1.4,.4,1) both}@keyframes stamp{from{opacity:0;transform:translateY(-26px) rotate(-9deg) scale(1.2)}to{opacity:1;transform:rotate(-3deg)}}}</style></head><body><section id="boot-title" aria-label="タイトル"><p>KAMISU CAT DEFENSE</p><h1 class="logo" aria-label="神栖を守れ！！"><span class="a" data-t="神栖を" aria-hidden="true">神栖を</span><span class="b" data-t="守れ！！" aria-hidden="true">守れ！！</span></h1><button id="tap-start" disabled>タップしてスタート</button><p class="landscape-note">本ゲームは横画面専用です。<br>ホーム画面に追加して、横画面でお楽しみください。</p><p id="boot-status" role="status">ゲームを準備しています…</p><button id="boot-retry" hidden onclick="location.reload()">もう一度ひらく</button><noscript>遊ぶにはJavaScriptを有効にしてください。</noscript></section><script>setTimeout(function(){var b=document.getElementById('boot-title');if(b&&!b.dataset.ready){document.getElementById('boot-status').textContent='起動に時間がかかっています。通信を確認して、もう一度ひらいてください。記録は消えません。';document.getElementById('boot-retry').hidden=false}},12000)</script><div id="app"><header><a class="brand" id="title" href="#">神栖を守れ！！<small>KAMISU CAT DEFENSE</small></a><span class="build-note">候補版 / 仮素材</span><button id="catalog">ねこ図鑑</button><button id="help">あそび方</button></header><main class="battle-layout"><div class="topline"><button id="pause" aria-label="一時停止">一時停止</button><div><span class="eyebrow">ねこの町まもり隊</span><h1 id="stage-name">神栖防衛作戦</h1></div><span id="timer">0秒</span></div><div class="controls"><button id="speed">速度 ×1</button><button id="settings">設定</button></div><section class="battlefield"><div id="hud"></div><div id="game" aria-label="猫と架空の侵略者が戦う横型の戦場"></div><div id="battle-chat" hidden aria-live="polite"></div><nav class="camera-controls" aria-label="戦場カメラ"><button data-pan="-1" aria-label="戦場を左へ">◀</button><button data-base="home">町へ</button><meter id="camera-position" min="0" max="100" value="0" aria-label="戦場の表示位置"></meter><button data-base="enemy">敵へ</button><button data-pan="1" aria-label="戦場を右へ">▶</button></nav></section><aside id="art-notice"><span id="art-status" role="status"></span><button id="retry-art" hidden>画像を再試行（1回）</button></aside><div id="message" role="status">準備中…</div><section id="cards" aria-label="猫の出撃"></section><button id="assist" class="battle-orb orb-assist" aria-pressed="false">おまかせ OFF</button><button id="map" class="battle-orb orb-map">作戦マップ</button><footer><span>1〜4キーでも出撃 / Pで停止</span><span id="save-note">クリア記録を自動保存</span></footer></main><dialog id="modal"></dialog></div><script type="module" src="/src/td.ts"></script></body></html>
