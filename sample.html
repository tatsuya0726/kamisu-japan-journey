<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ユニット比較 | 神栖を守れ！！</title><link rel="stylesheet" href="./src/td.css"><style>main{max-width:900px}canvas{width:100%;height:auto;border-radius:18px}label{display:block;padding:14px;background:#eee8d9;margin:10px 0;border-radius:12px}input{max-width:100%;margin:8px 0}button[aria-pressed=true]{background:#bc7445}nav{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}p{line-height:1.7}.status{font-size:12px}</style></head><body><header><a class="brand" href="./">神栖を守れ！！</a></header><main><span class="eyebrow">SAMPLE UNIT / LOOK COMPARISON</span><h1>写真風とドット版をくらべる</h1><p>同じ背景・向き・見かけの大きさ・足元で比較します。透明PNGの余白を除いて揃えます。画像はこの端末内で表示し、送信・保存しません。</p><label>写真風の透明PNG <input id="photo" type="file" accept="image/png,image/webp"><span class="status" id="photo-status">素材の受け取り待ち</span></label><label>ドット版の透明PNG <input id="pixel" type="file" accept="image/png,image/webp"><span class="status" id="pixel-status">素材の受け取り待ち</span></label><nav><button data-look="photo" aria-pressed="true">写真風</button><button data-look="pixel" aria-pressed="false">ドット版</button></nav><canvas id="preview" width="800" height="380" aria-label="同条件のユニット比較プレビュー"></canvas><nav><button data-motion="idle" aria-pressed="true">待機</button><button data-motion="walk" aria-pressed="false">移動</button><button data-motion="attack" aria-pressed="false">攻撃</button></nav><p>モーションは1枚の画像を動かす仮演出です。写真風・ドット版とも移動速度と攻撃タイミングは同一です。採用スタイルは未決定。</p></main><script type="module" src="./src/sample.ts"></script></body></html>
